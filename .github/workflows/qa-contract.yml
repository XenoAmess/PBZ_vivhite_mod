name: ROM contract checks
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s qa/tests -v
      # This checks the QA contract, not a model. Blender renders and model
      # reviews are separate artifacts tied to their exact input hashes.
